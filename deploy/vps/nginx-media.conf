server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    autoindex off;

    # CORS so local API / browser can fetch media
    add_header Access-Control-Allow-Origin *;
    add_header Access-Control-Allow-Methods "GET, HEAD, OPTIONS";

    location / {
        try_files $uri =404;
    }

    location ~* \.(mp4|wav|mp3|png|jpg|jpeg|webp)$ {
        expires 1h;
        add_header Access-Control-Allow-Origin *;
        try_files $uri =404;
    }
}
