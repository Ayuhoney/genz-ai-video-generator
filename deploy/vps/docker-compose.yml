# Isolated stack — does NOT touch /opt/genzcine or existing containers.
# Redis: host Redis DB /2 via host.docker.internal (no compose Redis service).
name: genzai-video

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "50m"
    max-file: "5"

services:
  media:
    image: nginx:1.27-alpine
    container_name: genzai-video-media
    restart: unless-stopped
    ports:
      # Public media (avoid 8090/8080 used by existing apps)
      - "9100:80"
    volumes:
      - genzai_media:/usr/share/nginx/html:ro
      - ./nginx-media.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - genzai-net
    logging: *default-logging

  api:
    build:
      context: ../../backend
      dockerfile: Dockerfile.worker
    image: genzai-video-worker:local
    container_name: genzai-video-api
    restart: unless-stopped
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000"]
    env_file:
      - .env
    environment:
      # Host Redis DB /2 (password from REDIS_PASSWORD in .env).
      REDIS_URL: redis://:${REDIS_PASSWORD}@host.docker.internal:6379/2
      REDIS_SSL_CERT_REQS: none
      MEDIA_LOCAL_ROOT: /data/media
      R2_PUBLIC_BASE_URL: ${MEDIA_PUBLIC_BASE_URL:-http://200.234.41.50:9100}
      CELERY_TASK_ALWAYS_EAGER: "false"
    ports:
      # Restrict :8000 to your IP with the host firewall.
      - "8000:8000"
    volumes:
      - genzai_media:/data/media
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - genzai-net
    depends_on:
      media:
        condition: service_started
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=5)",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 25s
    logging: *default-logging

  worker:
    build:
      context: ../../backend
      dockerfile: Dockerfile.worker
    image: genzai-video-worker:local
    container_name: genzai-video-worker
    restart: unless-stopped
    env_file:
      - .env
    environment:
      REDIS_URL: redis://:${REDIS_PASSWORD}@host.docker.internal:6379/2
      REDIS_SSL_CERT_REQS: none
      # Worker → API job-complete callbacks (internal).
      API_BASE_URL: http://api:8000
      MEDIA_LOCAL_ROOT: /data/media
      R2_PUBLIC_BASE_URL: ${MEDIA_PUBLIC_BASE_URL:-http://200.234.41.50:9100}
      CELERY_TASK_ALWAYS_EAGER: "false"
      CELERY_CONCURRENCY: ${CELERY_CONCURRENCY:-2}
      CELERY_LOGLEVEL: ${CELERY_LOGLEVEL:-INFO}
    volumes:
      - genzai_media:/data/media
    extra_hosts:
      - "host.docker.internal:host-gateway"
    mem_limit: ${WORKER_MEM_LIMIT:-4g}
    cpus: ${WORKER_CPUS:-2.0}
    networks:
      - genzai-net
    depends_on:
      api:
        condition: service_healthy
      media:
        condition: service_started
    logging: *default-logging

volumes:
  genzai_media:
    name: genzai-video-media-data

networks:
  genzai-net:
    name: genzai-video-net
    driver: bridge
